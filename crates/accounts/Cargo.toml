[package]
name = "accounts"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Embedded online account management for COSMIC applications"
repository = "https://github.com/cosmic-utils/accounts"

[features]
default = []
calendar = []
mail = []
contacts = []
tasks = []
libcosmic = ["dep:libcosmic", "dep:open"]

[dependencies]
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
async-trait = "0.1"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { workspace = true }
directories = "6"
hkdf = "0.12"
oauth2 = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tempfile = "3"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zeroize = "1"

libcosmic = { git = "https://github.com/pop-os/libcosmic", optional = true }
open = { version = "5", optional = true }
