[package]
name = "accounts"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Embedded online account management for COSMIC applications"
repository = "https://github.com/cosmic-ext-orbit/cosmic-ext-accounts"

[features]
default = []
calendar = []
mail = []
contacts = []
tasks = []
libcosmic = ["dep:libcosmic", "dep:open"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde", "clock"] }
directories = "6"
hkdf = "0.12"
oauth2 = "4.4"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
url = "2.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
zeroize = "1"

libcosmic = { git = "https://github.com/pop-os/libcosmic", optional = true }
open = { version = "5", optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
