[workspace]
resolver = "2"
members = ["crates/accounts"]

[workspace.dependencies]
oauth2 = "4.4"
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
url = "2.4"

[workspace.dependencies.chrono]
version = "0.4"
features = ["serde", "clock"]

[workspace.dependencies.reqwest]
version = "0.11"
features = ["json"]

[workspace.dependencies.serde]
version = "1.0"
features = ["derive"]

[workspace.dependencies.tokio]
version = "1.0"
features = ["full"]

[workspace.dependencies.uuid]
version = "1.0"
features = [
    "v4",
    "serde",
]
