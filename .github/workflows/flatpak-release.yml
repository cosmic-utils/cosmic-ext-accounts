name: Flatpak release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # This container is a minimal freedesktop-sdk image (no apt/dnf, no
      # bash) that already bundles Python with aiohttp/tomlkit preinstalled,
      # so no dependency install is needed here.
      - name: Ensure cargo-sources.json is up to date
        run: |
          curl -sL -o /tmp/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 /tmp/flatpak-cargo-generator.py Cargo.lock -o crates/ui/cargo-sources.json

      - uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'

      - name: Configure desktop OAuth clients
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: just configure-providers crates/ui/data/providers

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: accounts.flatpak
          manifest-path: crates/ui/dev.edfloreshz.Accounts.json
          cache-key: flatpak-builder-${{ github.sha }}
